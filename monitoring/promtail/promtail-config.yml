server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: api-files
    static_configs:
      - targets: [localhost]
        labels:
          job: api
          app: precisioncore-api
          __path__: /var/log/api/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            requestId: requestId
            userId: userId
            route: route
            duration: duration
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
